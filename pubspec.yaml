name: vika
description: Vika - AI fitness coaching for Vietnamese home exercisers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. The Eyes (Camera)
  camera: ^0.12.0
  native_device_orientation: ^2.1.0

  # 2. The Brain (AI Pose Detection)
  google_mlkit_pose_detection: ^0.14.1

  # 3. The Permissions (Ask user to use camera)
  permission_handler: ^12.0.1

  # 4. Icons
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  audioplayers: ^6.6.0

  #6. For storing onboarding completion status
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.0.0
  flutter_facebook_auth: ^7.0.0
  # sign_in_with_apple: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/squat/
    - assets/images/

  # ─── Fonts ───
  # Vika uses Fraunces (italic display) + Be Vietnam Pro (sans body) per
  # DESIGN.md. Both are loaded at runtime via the `google_fonts` package
  # — no manual .ttf bundling required. The package caches to disk after
  # first fetch, so second app launch is instant.
  #
  # See lib/widgets/plan/plan_typography.dart for the helper functions
  # (frauncesItalic, beVietnamPro) that wrap GoogleFonts.X(textStyle:).
