name: vinafit_mobile
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. The Eyes (Camera)
  camera: ^0.10.5

  # 2. The Brain (AI Pose Detection)
  google_mlkit_pose_detection: ^0.12.0

  # 3. The Permissions (Ask user to use camera)
  permission_handler: ^11.0.1

  # 4. Icons
  cupertino_icons: ^1.0.2
  #5. segmentation
  google_mlkit_selfie_segmentation: ^0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true